name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: MySQL cloud function identity and deletion regression (mock SDK)
        run: pnpm test:api

      - name: Release checker tests
        run: pnpm test:release

      - name: Database regression (isolated PostgreSQL)
        run: pnpm test:database

      - name: Release build (mp-weixin)
        run: pnpm build:mp-weixin:release

      - name: Verify release artifact
        run: pnpm verify:phase10
